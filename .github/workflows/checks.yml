name: Theme checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_feed.py'
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: athena-prebuilt
          path: dist/*
